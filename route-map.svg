<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">呼和浩特周边自驾路线方位示意图（已按公开地图校核）</title>
  <desc id="desc">以呼和浩特为住宿基地，按公开地图中的相对方位展示哈达门、敕勒川、黄花窝铺、红石崖、九龙湾和辉腾锡勒方向；图中位置不按比例，距离为公路规划估算。</desc>
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="fade"><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="fade" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8e826e" flood-opacity=".18"/></filter>
    <style>
      .ink{font-family:"STKaiti","KaiTi","楷体","Comic Sans MS",cursive;fill:#26312d}
      .small{font-size:18px}.label{font-size:25px;font-weight:700}.note{font-size:19px}.route{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:5}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fbf8f0"/>
  <rect x="14" y="14" width="1172" height="732" rx="8" fill="none" stroke="#e3dacb" stroke-width="2"/>
  <g filter="url(#paperNoise)">
    <text class="ink" x="55" y="83" font-size="28" fill="#5c9f79">呼和浩特</text>
    <text class="ink" x="56" y="116" font-size="28" fill="#5c9f79">周边自驾</text>
    <text class="ink small" x="1040" y="74" fill="#6f756e">北 ↑</text>
    <text class="ink small" x="820" y="720" fill="#8b857a">方向按公开地图校核 · 位置不按比例</text>

    <!-- hand-drawn route lines -->
    <path class="route" stroke="#78956f" d="M525 376 C493 329 469 273 442 220 C424 186 419 153 414 119"/>
    <path class="route" stroke="#78956f" opacity=".35" d="M530 379 C498 332 474 276 447 223 C429 189 424 156 418 121"/>
    <path class="route" stroke="#5d8ea0" d="M530 377 C553 335 585 293 629 258 C644 246 654 235 665 222"/>
    <path class="route" stroke="#d36d58" d="M545 365 C603 317 656 261 706 211 C734 182 752 151 770 119"/>
    <path class="route" stroke="#d36d58" opacity=".35" d="M548 370 C606 322 660 266 711 215 C739 186 757 155 774 122"/>
    <path class="route" stroke="#b45a62" d="M555 383 C636 355 714 321 788 300 C838 286 883 275 925 267"/>
    <path class="route" stroke="#886ca7" d="M558 398 C619 396 681 389 733 379 C759 374 781 369 804 362"/>
    <path class="route" stroke="#4f8caa" d="M574 350 C663 296 747 249 830 205 C887 174 940 142 1000 106"/>
    <path class="route" stroke="#aa8c57" d="M579 399 C606 406 630 415 658 421"/>

    <!-- central base -->
    <g filter="url(#shadow)"><rect x="422" y="348" width="188" height="74" rx="19" fill="#f4d970" transform="rotate(-2 516 385)"/></g>
    <circle cx="516" cy="386" r="10" fill="#26312d"/>
    <text class="ink label" x="448" y="379">呼和浩特</text><text class="ink note" x="450" y="405">住宿基地</text>

    <!-- destination dots -->
    <circle cx="414" cy="119" r="8" fill="#78956f"/><circle cx="665" cy="222" r="8" fill="#5d8ea0"/>
    <circle cx="770" cy="119" r="8" fill="#d36d58"/><circle cx="925" cy="267" r="8" fill="#b45a62"/>
    <circle cx="804" cy="362" r="8" fill="#886ca7"/><circle cx="1000" cy="106" r="8" fill="#4f8caa"/>
    <circle cx="658" cy="421" r="8" fill="#aa8c57"/>

    <!-- labels -->
    <text class="ink label" x="275" y="97">哈达门森林公园</text>
    <text class="ink small" x="277" y="128" fill="#78956f">北/西北 · 30–45 km · 50–80 min</text>

    <text class="ink label" x="590" y="183">敕勒川草原</text>
    <text class="ink small" x="590" y="213" fill="#5d8ea0">东北 · 20–30 km · 35–55 min</text>

    <text class="ink label" x="690" y="76">黄花窝铺</text>
    <text class="ink small" x="690" y="101" fill="#d36d58">北偏东 · 35–50 km · 60–90 min</text>

    <text class="ink label" x="936" y="254">红石崖</text>
    <text class="ink small" x="936" y="284" fill="#b45a62">东北 · 50–75 km · 1.5–2 h</text>

    <text class="ink label" x="818" y="362">九龙湾</text>
    <text class="ink small" x="818" y="391" fill="#886ca7">东北/东 · 45–65 km · 1–1.5 h</text>

    <text class="ink label" x="865" y="76">辉腾锡勒方向</text>
    <text class="ink small" x="865" y="103" fill="#4f8caa">黄花沟 / 牛粑粑 / 二阳卜</text>
    <text class="ink small" x="865" y="129" fill="#4f8caa">东北偏东 · 130–180 km · 2–3 h</text>

    <text class="ink label" x="680" y="451">内蒙古博物院 / 美术馆</text>
    <text class="ink small" x="681" y="478" fill="#aa8c57">市区东侧 · 约 2–15 km</text>

    <!-- route notes -->
    <g filter="url(#shadow)"><rect x="53" y="492" width="292" height="133" rx="8" fill="#d9efd9" transform="rotate(-2 199 558)"/></g>
    <text class="ink note" x="76" y="532" fill="#3f805a">模块 B：北侧森林线</text>
    <text class="ink small" x="76" y="564">哈达门 → 敕勒川</text>
    <text class="ink small" x="76" y="593">往返约 95–140 km</text>

    <g filter="url(#shadow)"><rect x="385" y="646" width="380" height="70" rx="8" fill="#f6e7bd" transform="rotate(1 575 681)"/></g>
    <text class="ink note" x="414" y="679">模块 C 最远：科凉线 → 牛粑粑 → 二阳卜</text>
    <text class="ink small" x="414" y="704" fill="#8c6a35">约 280–360 km 往返，不和 A/B 叠加</text>
  </g>
</svg>
